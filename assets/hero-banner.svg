    <ellipse cx="104" cy="76" rx="4" ry="5" fill="#003366"/>
    <ellipse cx="124" cy="76" rx="4" ry="5" fill="#003366"/>
    <ellipse cx="135" cy="86" rx="6" ry="5" fill="#333"/>
    <path d="M 118 94 Q 135 102 145 94" fill="none" stroke="#333" stroke-width="2"/>
    <ellipse cx="72" cy="52" rx="11" ry="16" fill="url(#sonicBlue)"/>
    <ellipse cx="72" cy="52" rx="6" ry="9" fill="#c5a878"/>
    <ellipse cx="50" cy="140" rx="18" ry="12" fill="url(#sonicBlue)"/>
