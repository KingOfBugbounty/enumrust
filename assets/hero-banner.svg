    <rect x="0" y="0" width="95" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="47" y="17" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Secrets</text>
    <rect x="105" y="0" width="95" height="26" rx="13" fill="#9333ea" opacity="0.25"/>
