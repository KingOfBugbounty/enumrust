  <text x="218" y="386" font-family="monospace" font-size="12" fill="#c5c5c5">./enumrust -d target.com --bugbounty --full-scan</text>
  <text x="400" y="395" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">by @ofjaaah | Security Scanner</text>
